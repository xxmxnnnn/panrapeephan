<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | HR Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-left">
                <h1 class="fw-bold mb-3">HR Workspace</h1>
                <p class="fs-6 opacity-75">ระบบบริหารจัดการทรัพยากรบุคคล<br>และการลงเวลาปฏิบัติงานอัจฉริยะ</p>
                <div class="mt-5 p-4 bg-white bg-opacity-10 rounded-3">
                    <small class="d-block fw-bold mb-2 text-uppercase">Demo Accounts</small>
                    <div class="small opacity-75">
                        <div>• Admin: <code>admin</code> / <code>1234</code></div>
                        <div>• Manager: <code>mgr01</code> / <code>1234</code></div>
                        <div>• Employee: <code>emp01</code> / <code>1234</code></div>
                    </div>
                </div>
            </div>
            <div class="login-right">
                <h3 class="fw-bold text-dark mb-1">เข้าสู่ระบบ</h3>
                <p class="text-muted mb-5">กรุณากรอกข้อมูลเพื่อดำเนินการต่อ</p>
                
                <form onsubmit="window.handleLogin(event)">
                    <div class="mb-4">
                        <label class="form-label">รหัสผู้ใช้งาน</label>
                        <input type="text" class="form-control" id="loginUsername" placeholder="Employee ID" required>
                    </div>
                    <div class="mb-5">
                        <label class="form-label">รหัสผ่าน</label>
                        <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3">เข้าสู่ระบบ</button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
